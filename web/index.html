<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReceiptLens</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>ReceiptLens</h1>
    <div id="session">
      <span id="user"></span>
      <button id="login" type="button">Sign in</button>
      <button id="logout" type="button" hidden>Sign out</button>
    </div>
  </header>

  <main id="app" hidden>
    <section class="card">
      <h2>Upload a receipt or invoice</h2>
      <p class="hint">JPG, PNG, WEBP or PDF, up to 3.75 MB. Extraction takes a few seconds.</p>
      <form id="upload-form">
        <input id="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" required>
        <button type="submit">Upload</button>
      </form>
      <p id="upload-status" role="status"></p>
    </section>

    <section class="card">
      <div class="row">
        <h2>Expenses</h2>
        <div>
          <button id="refresh" type="button">Refresh</button>
          <button id="export" type="button">Export CSV</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Date</th><th>Supplier</th><th>Category</th><th>Total</th><th>Status</th></tr>
          </thead>
          <tbody id="expenses"></tbody>
        </table>
      </div>
    </section>
  </main>

  <p id="signed-out" class="hint">Sign in to upload documents and see your expenses.</p>
</body>
</html>
