name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Lint and test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest==8.3.5 ruff==0.11.13 boto3
      - run: ruff check app tests
      - run: pytest -q

  templates:
    name: Lint CloudFormation and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install cfn-lint==1.60.0
      - run: cfn-lint # reads .cfnlintrc.yaml
      - run: shellcheck scripts/*.sh

  security:
    name: IaC security scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install checkov==3.4.3
      # Fails on any finding not explicitly accepted (with a reason) in .checkov.yaml
      - run: checkov -d infra -d bootstrap -d .github/workflows --config-file .checkov.yaml --compact
